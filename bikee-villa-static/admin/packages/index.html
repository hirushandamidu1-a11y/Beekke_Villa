<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packages Management - Beekke Villa Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'woods':    '#3E2723',
            'woods-light': '#5D4037',
            'woods-dark':  '#1B0000',
            'gold':     '#D4AF37',
            'gold-light': '#E8CC6A',
            'gold-dark':  '#A68B1E',
            'parchment': '#FDF5E6',
            'parchment-dark': '#F5E6C8',
            'ink':      '#2C1810',
          },
          fontFamily: {
            display: ['Playfair Display', 'Georgia', 'serif'],
            body:    ['Lora', 'Georgia', 'serif'],
            classic: ['EB Garamond', 'Georgia', 'serif'],
          },
        }
      }
    }
  </script>
  <style>
    .admin-card {
      background: linear-gradient(145deg, rgba(93, 64, 55, 0.4) 0%, rgba(27, 0, 0, 0.6) 100%);
      border: 1px solid rgba(212, 175, 55, 0.1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(5px);
    }
    .sidebar-link.active {
      background: rgba(212, 175, 55, 0.1);
      border-right: 2px solid #D4AF37;
      color: #D4AF37;
    }
    .sidebar-link:hover:not(.active) {
      background: rgba(212, 175, 55, 0.05);
      color: #E8CC6A;
    }
  </style>
</head>
<body class="bg-woods-dark text-parchment min-h-screen">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-woods-dark border-r border-gold/10 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
      <div class="p-6 border-b border-gold/10">
        <a href="../../index.html" target="_blank" class="block group">
          <p class="font-display text-2xl font-bold text-gold tracking-widest">Beekke</p>
          <p class="font-classic text-parchment/30 text-xs tracking-[0.4em] uppercase">Admin Panel</p>
        </a>
      </div>
      <nav class="flex-1 py-6 overflow-y-auto">
        <a href="../index.html" class="sidebar-link flex items-center gap-4 px-6 py-3 font-classic text-sm tracking-wider text-parchment/60"><span class="text-lg">📊</span><span>Dashboard</span></a>
        <a href="../bookings/index.html" class="sidebar-link flex items-center gap-4 px-6 py-3 font-classic text-sm tracking-wider text-parchment/60"><span class="text-lg">📅</span><span>Bookings</span></a>
        <a href="../gallery/index.html" class="sidebar-link flex items-center gap-4 px-6 py-3 font-classic text-sm tracking-wider text-parchment/60"><span class="text-lg">🖼️</span><span>Gallery</span></a>
        <a href="index.html" class="sidebar-link active flex items-center gap-4 px-6 py-3 font-classic text-sm tracking-wider text-parchment/60"><span class="text-lg">📦</span><span>Packages</span></a>
        <a href="../experiences/index.html" class="sidebar-link flex items-center gap-4 px-6 py-3 font-classic text-sm tracking-wider text-parchment/60"><span class="text-lg">🌴</span><span>Experiences</span></a>
        <a href="../testimonials/index.html" class="sidebar-link flex items-center gap-4 px-6 py-3 font-classic text-sm tracking-wider text-parchment/60"><span class="text-lg">💬</span><span>Testimonials</span></a>
        <a href="../faqs/index.html" class="sidebar-link flex items-center gap-4 px-6 py-3 font-classic text-sm tracking-wider text-parchment/60"><span class="text-lg">❓</span><span>FAQs</span></a>
        <a href="../settings/index.html" class="sidebar-link flex items-center gap-4 px-6 py-3 font-classic text-sm tracking-wider text-parchment/60"><span class="text-lg">⚙️</span><span>Settings</span></a>
        <a href="../users/index.html" class="sidebar-link flex items-center gap-4 px-6 py-3 font-classic text-sm tracking-wider text-parchment/60"><span class="text-lg">👥</span><span>Users</span></a>
      </nav>
      <div class="p-6 border-t border-gold/10">
        <button id="logoutBtn" class="w-full text-left font-classic text-sm tracking-widest uppercase text-gold hover:text-gold-light transition-colors">Log Out</button>
      </div>
    </aside>
    
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden" onclick="toggleSidebar()"></div>
    
    <main class="flex-1 flex flex-col min-h-screen">
      <header class="sticky top-0 z-20 bg-woods-dark/95 backdrop-blur border-b border-gold/10 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <button onclick="toggleSidebar()" class="lg:hidden text-gold text-xl p-1">☰</button>
          <div><h1 class="font-display text-xl text-parchment font-semibold">Packages</h1><p class="font-classic text-parchment/30 text-xs tracking-wider">Manage Pricing & Packages</p></div>
        </div>

        <div class="flex items-center gap-4">
          <!-- Notification Bell Container -->
          <div class="relative" id="notifContainer">
            <button id="notifBellBtn" class="relative p-2 text-gold hover:text-gold-light text-xl transition-colors focus:outline-none" title="Check-out Notifications">
              🔔
              <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white font-bold text-[0.65rem] px-1.5 py-0.5 rounded-full animate-pulse">0</span>
            </button>
            <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-80 bg-woods-dark border border-gold/30 rounded-lg shadow-2xl p-4 z-50">
              <div class="flex items-center justify-between border-b border-gold/10 pb-2 mb-3">
                <h4 class="font-display text-sm text-gold font-bold">Check-out Alerts</h4>
                <span class="font-classic text-[0.65rem] text-parchment/40 uppercase tracking-widest">Today & Recent</span>
              </div>
              <div id="notifList" class="max-h-64 overflow-y-auto space-y-2">
                <p class="text-xs text-parchment/40 text-center py-4 font-classic">Loading alerts...</p>
              </div>
            </div>
          </div>
        </div>
      </header>
      
      <div class="flex-1 p-6 lg:p-8 overflow-y-auto">
        <!-- Add/Edit Package Form -->
        <div class="admin-card rounded-lg p-8 mb-8">
            <h2 id="formTitle" class="font-display text-2xl text-gold mb-6">Add New Package</h2>
            <form id="packageForm" class="space-y-6">
                <input type="hidden" id="packageId">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-parchment/60 font-classic tracking-wider text-xs uppercase mb-2">Package Title</label>
                        <input type="text" id="title" required class="w-full bg-woods border border-gold/20 rounded px-4 py-3 text-parchment focus:border-gold focus:outline-none transition-colors" placeholder="e.g. Family / Event Package" />
                    </div>
                    <div>
                        <label class="block text-parchment/60 font-classic tracking-wider text-xs uppercase mb-2">Internal Code Name (no spaces)</label>
                        <input type="text" id="codeName" required class="w-full bg-woods border border-gold/20 rounded px-4 py-3 text-parchment focus:border-gold focus:outline-none transition-colors" placeholder="e.g. family_ac" />
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-parchment/60 font-classic tracking-wider text-xs uppercase mb-2">Subtitle / Type</label>
                        <input type="text" id="subtitle" required class="w-full bg-woods border border-gold/20 rounded px-4 py-3 text-parchment focus:border-gold focus:outline-none transition-colors" placeholder="e.g. Air Conditioned · 1 Day" />
                    </div>
                    <div>
                        <label class="block text-parchment/60 font-classic tracking-wider text-xs uppercase mb-2">Price (LKR)</label>
                        <input type="number" id="price" required class="w-full bg-woods border border-gold/20 rounded px-4 py-3 text-parchment focus:border-gold focus:outline-none transition-colors" placeholder="30000" />
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-parchment/60 font-classic tracking-wider text-xs uppercase mb-2">Emoji Icon</label>
                        <input type="text" id="icon" required class="w-full bg-woods border border-gold/20 rounded px-4 py-3 text-parchment focus:border-gold focus:outline-none transition-colors" placeholder="❄️" />
                    </div>
                    <div class="flex items-center gap-3 mt-8">
                        <input type="checkbox" id="isFeatured" class="w-5 h-5 accent-gold cursor-pointer" />
                        <label for="isFeatured" class="text-parchment/80 font-body text-sm cursor-pointer">Highlight as "Most Popular" (Gold Card)</label>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex items-center gap-3 mt-2">
                        <input type="checkbox" id="isSmallCard" class="w-5 h-5 accent-gold cursor-pointer" />
                        <label for="isSmallCard" class="text-parchment/80 font-body text-sm cursor-pointer">Show as Small Card (e.g. Cook packages)</label>
                    </div>
                </div>

                <div>
                    <label class="block text-parchment/60 font-classic tracking-wider text-xs uppercase mb-2">Features (One per line)</label>
                    <textarea id="features" rows="4" required class="w-full bg-woods border border-gold/20 rounded px-4 py-3 text-parchment focus:border-gold focus:outline-none transition-colors" placeholder="Exclusive villa access&#10;All 5 rooms with AC&#10;Up to 12 guests"></textarea>
                </div>

                <div class="pt-4 border-t border-gold/10 flex items-center gap-4">
                    <button type="submit" id="saveBtn" class="bg-gold text-woods font-classic text-sm tracking-widest uppercase px-8 py-3 rounded hover:bg-gold-light transition-colors font-bold shadow-lg flex items-center gap-2">
                        <span>Save Package</span>
                    </button>
                    <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden text-parchment/60 font-classic text-sm tracking-widest uppercase hover:text-parchment transition-colors px-4 py-2">
                        Cancel
                    </button>
                    <span id="saveStatus" class="font-classic text-sm tracking-widest uppercase text-green-400 hidden">Saved Successfully!</span>
                </div>
            </form>
        </div>

        <!-- Packages List -->
        <div class="admin-card rounded-lg p-8">
            <h2 class="font-display text-2xl text-gold mb-6">Existing Packages</h2>
            <div id="packagesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Packages injected here -->
                <p class="text-parchment/50">Loading...</p>
            </div>
        </div>

      </div>
    </main>
  </div>
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }
  </script>
  <script type="module" src="../../assets/js/admin-packages.js"></script>
</body>
</html>
